name = "plumbline-storefront"
compatibility_date = "2026-08-29"

# Static site: serve the storefront directory as the site root.
# No Worker script needed — assets-only deployment.
[assets]
directory = "./storefront"

# Custom domains: attached automatically on deploy. The placeholder DNS
# records imported from GoDaddy were deleted 2026-08-29 to unblock this;
# hostname resolution confirmed empty before this deploy.
routes = [
  { pattern = "plumblinestudio.dev", custom_domain = true },
  { pattern = "www.plumblinestudio.dev", custom_domain = true }
]
